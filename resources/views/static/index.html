<!DOCTYPE html>
<html class="no-js" lang="en"
    data-template="{{template_preferences.default_template}}"
    data-theme="{{template_preferences.initial_theme}}"
    data-default-theme="{{template_preferences.default_theme}}"
    data-enabled-templates="{{template_preferences.enabled_templates}}"
    data-themed-templates="{{template_preferences.themed_templates}}">
<head> 
    <!--- basic page needs
    ================================================== -->
    <meta charset="utf-8">
    <title>{{profile.page_title}}</title>
    <meta name="description" content="{{profile.meta_description}}">
    <meta name="author" content="{{profile.fullname}}">

    <!-- mobile specific metas
    ================================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="canonical" href="{{canonical_url}}">
    <script src="/js/portfolio-preferences.js"></script>

    <link rel="preload" as="image" href="{{profile.headshot_url}}" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Public+Sans:wght@400;500;600;700&display=swap">

    <!-- CSS
    ================================================== -->
    <link rel="stylesheet" href="/css/vendor.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/portfolio-templates.css">

    <!-- favicons
    ================================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

</head>

<body id="top">
    <a class="skip-link" href="#main-content">Skip to content</a> 
 
    <!-- # page wrap
    ================================================== -->
    <div class="s-pagewrap"> 
        <div class="circles" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>  
        <!-- ## site header 
        ================================================== -->
{{> navigation}}
        <!-- ## main content
        ==================================================- -->
        <main id="main-content" class="s-content" tabindex="-1">
            <div class="particle-backdrop" aria-hidden="true">
                <canvas class="hero-particles" aria-hidden="true"></canvas>
                <template id="globe-logos">
                    {{#tools}}
                    <img src="{{image_url}}" alt="{{title}}" data-appearance="{{appearance}}">
                    {{/tools}}
                </template>
            </div>
 
            


   
{{> hero}}
{{> about}}
{{> projects}}
{{> services}}
{{> contact}}
        </main> <!-- end s-content --> 
        <!-- ## footer
        ================================================== -->
        <footer class="s-footer"> 
{{> preferences}}
            <div class="row">
                <div class="column ss-copyright">
                    <span>© {{year}} {{profile.display_name}}</span> 
                    <span>Template adapted from <a href="https://www.styleshout.com/" target="_blank">StyleShout</a></span>
                </div>

                <div class="ss-go-top">
                    <a class="smoothscroll" title="Back to Top" href="#top">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill-rule="evenodd" clip-rule="evenodd"><path d="M11 2.206l-6.235 7.528-.765-.645 7.521-9 7.479 9-.764.646-6.236-7.53v21.884h-1v-21.883z"/></svg>
                    </a>
                </div>
            </div> 
        </footer> <!-- end s-footer --> 
    </div> <!-- end -s-pagewrap --> 
    <!-- Java Script
    ================================================== -->
    <script defer src="/js/vercel-analytics.js"></script>
    <script defer src="/js/main.js"></script>
    <script defer src="/js/particles.js"></script>
</body>
</html>
